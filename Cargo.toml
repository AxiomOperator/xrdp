[package]
name = "xrdp-gui"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
keyring = "4.2.0"
libc = "0.2.191"
notify-rust = "4.18.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
shlex = "2.0.1"
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
